name: create-new-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release"
        required: true
        default: "v0.0.0-alpha.0"
        type: string
      prerelease:
        description: "Create as pre-release"
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: cachix/install-nix-action@v31
      - name: Release
        if: ${{ !inputs.prerelease }}
        run: nix develop --command just release "${{ inputs.version }}" "${{ github.actor }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pre-release
        if: ${{ inputs.prerelease }}
        run: nix develop --command just pre-release "${{ inputs.version }}" "${{ github.actor }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
